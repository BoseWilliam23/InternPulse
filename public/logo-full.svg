<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullMarkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2558" />
      <stop offset="35%" stop-color="#0E4884" />
      <stop offset="70%" stop-color="#009BA9" />
      <stop offset="100%" stop-color="#00C4B8" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (scaled 260x260 at x=30, y=30) -->
  <g transform="translate(30, 30) scale(0.65)">
    <!-- Rounded Box Frame -->
    <path 
      d="M 52 230 
         A 64 64 0 0 0 116 348 
         L 284 348 
         A 64 64 0 0 0 348 284 
         L 348 116 
         A 64 64 0 0 0 284 52 
         L 116 52 
         A 64 64 0 0 0 52 116 
         L 52 205" 
      stroke="url(#fullMarkGrad)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Pulse line -->
    <path 
      d="M 52 228 
         L 108 228 
         L 152 165 
         L 198 282 
         L 282 134" 
      stroke="url(#fullMarkGrad)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Arrow head -->
    <path 
      d="M 230 134 
         L 284 132 
         L 286 186" 
      stroke="url(#fullMarkGrad)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Brand Typography -->
  <text x="320" y="165" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="108" font-weight="800" letter-spacing="-1">
    <tspan fill="#0C2340">Intern</tspan><tspan fill="#00C4B8">Pulse</tspan>
  </text>

  <!-- Tagline -->
  <text x="325" y="225" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#5F6F81" letter-spacing="0.2">
    Stay Connected. Track Progress. Grow Together.
  </text>
</svg>
